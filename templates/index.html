<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Exit Control</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-xl border border-red-500/30 max-w-sm w-full text-center shadow-2xl">
        <h1 class="text-xl font-bold mb-2 text-red-400">Emergency Control</h1>
        <p class="text-xs text-gray-400 mb-6">Clicking below will immediately square off positions and stop automation.</p>
        
        <!-- Manual Close Button -->
        <button onclick="openModal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition">
            MANUAL CLOSE
        </button>
        
        <div id="status-msg" class="mt-4 text-xs font-mono"></div>
    </div>

    <!-- Warning Confirmation Modal -->
    <div id="warning-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-800 border border-red-500 rounded-xl p-6 max-w-sm w-full text-left space-y-4">
            <h3 class="text-lg font-bold text-red-400">⚠️ Are you sure?</h3>
            <p class="text-xs text-gray-300">
                This will trigger a POST request to <code class="text-red-300 bg-gray-900 px-1 py-0.5 rounded">/api/manual-close</code>, close all trades, and set your manual flag to true.
            </p>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs rounded text-gray-300">Cancel</button>
                <button onclick="sendManualClose()" id="confirm-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-xs font-bold rounded text-white">Yes, Close All</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('warning-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('warning-modal').classList.add('hidden');
        }

        async function sendManualClose() {
            const btn = document.getElementById('confirm-btn');
            const statusDiv = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.textContent = "Processing...";

            try {
                const response = await fetch('/api/manual-close', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'manual_close' })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = "mt-4 text-xs font-mono text-emerald-400";
                    statusDiv.textContent = "✅ Success: " + data.message;
                } else {
                    statusDiv.className = "mt-4 text-xs font-mono text-red-400";
                    statusDiv.textContent = "❌ Error: " + data.message;
                }
            } catch (error) {
                statusDiv.className = "mt-4 text-xs font-mono text-red-400";
                statusDiv.textContent = "❌ Network Error: " + error.message;
            } finally {
                closeModal();
                btn.disabled = false;
                btn.textContent = "Yes, Close All";
            }
        }
    </script>
</body>
</html>
